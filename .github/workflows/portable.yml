name: Portable SAB2 regression

on:
  push:
    branches: [port/windows-macos]
  pull_request:
    branches: [port/windows-macos]

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            configure: '-G "Visual Studio 17 2022" -A x64'
          - platform: macOS 27 arm64
            runner: xcode-27
            configure: '-DCMAKE_OSX_ARCHITECTURES=arm64'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Apple Silicon
        if: runner.os == 'macOS'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
      - name: Configure
        run: cmake -S . -B build-port ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DSAB2_PORTABLE_TESTS_ONLY=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-port --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build-port -C Release --output-on-failure --no-tests=error

  replay:
    name: Video replay (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
          - platform: macOS 27 arm64
            runner: xcode-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixture dependencies
        run: python -m pip install onnx==1.19.1 opencv-python-headless==4.12.0.88
      - name: Build replay on macOS
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          brew install opencv@4 onnxruntime
          cmake -S . -B build/replay -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=OFF -DSAB2_BUILD_REPLAY=ON \
            -DSAB2_ONNXRUNTIME_ROOT="$(brew --prefix onnxruntime)" \
            -DOpenCV_DIR="$(brew --prefix opencv@4)/lib/cmake/opencv4"
          cmake --build build/replay --target sab2_video_replay --parallel 3
          python tests/video_replay_smoke.py ./build/replay/sab2_video_replay
      - name: Build replay on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          curl.exe -fLsS --retry 3 -o cv.exe https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-windows.exe
          7z x -bso0 -bsp0 -y cv.exe -o"$env:RUNNER_TEMP/cv"
          nuget install Microsoft.ML.OnnxRuntime -Version 1.22.0 -OutputDirectory "$env:RUNNER_TEMP/ort" -NonInteractive
          cmake -S . -B build/replay -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=OFF -DSAB2_PORTABLE_TESTS_ONLY=ON -DSAB2_BUILD_REPLAY=ON `
            "-DSAB2_ONNXRUNTIME_ROOT=$env:RUNNER_TEMP/ort/Microsoft.ML.OnnxRuntime.1.22.0" `
            "-DOpenCV_DIR=$env:RUNNER_TEMP/cv/opencv/build"
          cmake --build build/replay --config Release --target sab2_video_replay --parallel 3
          python tests/video_replay_smoke.py ./build/replay/Release/sab2_video_replay.exe
